<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08080d" />
    <meta
      name="description"
      content="A party card game around a shared 3D table — everyone sees the same room, the same cards, and each other in real time."
    />
    <title>Peril</title>

    <!-- Inline so it costs no request and cannot 404. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2308080d'/%3E%3Crect x='9' y='6' width='11' height='16' rx='2' fill='%23f7f6f1' transform='rotate(-12 14.5 14)'/%3E%3Crect x='13' y='9' width='11' height='16' rx='2' fill='%23ffc46b' transform='rotate(9 18.5 17)'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #app { width: 100%; height: 100%; overflow: hidden; }
      body {
        background: #08080d;
        color: #f2f2f7;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        overscroll-behavior: none;
      }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }

      /* Shown until the first module frame paints. */
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #08080d; z-index: 10; transition: opacity .4s ease;
      }
      #boot .mark {
        font-size: 30px; font-weight: 800; letter-spacing: -0.03em;
        display: flex; align-items: center; gap: 11px; opacity: .9;
      }
      #boot .dot {
        width: 9px; height: 9px; border-radius: 50%; background: #ffc46b;
        animation: pulse 1.15s ease-in-out infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot"><div class="mark"><span class="dot"></span>Peril</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
